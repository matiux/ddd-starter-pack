name: "Test"

on:
  workflow_call: ~
  workflow_dispatch: ~

jobs:
  run-tests:
    name: Run tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:32574/ddd_sp_test?serverVersion=5

    services:
      ddd-starter-pack-db:
        image: mariadb:10.3.22
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ddd_sp_test
        ports:
          - 32574:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysql --host 127.0.0.1 --port 32574 -uroot -proot -e "SELECT 1" && break
            sleep 2
          done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create Schema
        run: ./tools/bin/project/project doctrine-schema-create

      - name: Run unit tests (PHPUnit)
        env:
          XDEBUG_MODE: coverage
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SQS_QUEUE_NAME: ${{ secrets.AWS_SQS_QUEUE_NAME }}
          AWS_SNS_TOPIC_ARN: ${{ secrets.AWS_SNS_TOPIC_ARN }}
        run: ./tools/bin/project/project coverage

      - name: Upload coverage to Codecov
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./.coverage/coverage-clover.xml
